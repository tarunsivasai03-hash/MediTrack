# MediTrack with PostgreSQL.  Usage:
#   cp .env.example .env        # then edit SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec web flask create-user --role admin --email you@example.com --name "Your Name"
#
# Put a TLS-terminating proxy (nginx, Caddy, a cloud load balancer) in front of port 8000
# and set TRUST_PROXY=1 and SESSION_COOKIE_SECURE (already on in production).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hms:${POSTGRES_PASSWORD}@db:5432/hms
      UPLOAD_FOLDER: /app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/instance/uploads

  # Sends appointment reminders once a day. Same image, no migrations.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hms:${POSTGRES_PASSWORD}@db:5432/hms
      RUN_MIGRATIONS: "0"
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["sh", "-c", "while true; do flask send-reminders; sleep 86400; done"]

volumes:
  db_data:
  uploads:
